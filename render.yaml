# Render Blueprint — riflette i servizi attualmente deployati.
# NOTA: i servizi live sono stati creati via Render MCP/API con gli stessi
# parametri; gli URL effettivi includono il suffisso assegnato da Render.
services:
  # Backend Web Service (Node.js + Express + Socket.io)
  - type: web
    name: whatsapp2-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://whatsapp2-frontend-0pdh.onrender.com
      # Render assegna PORT automaticamente; il server legge process.env.PORT
      # Persistenza: JsonStore su filesystem effimero (free tier, no disk).
      # Con un disco persistente montato in /var/data: aggiungere DATA_DIR=/var/data

  # Frontend Static Site (React + Vite)
  # VITE_* vengono iniettate a build-time da Vite.
  - type: web
    name: whatsapp2-frontend
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://whatsapp2-backend-tz1e.onrender.com/api/v1
      - key: VITE_SOCKET_URL
        value: https://whatsapp2-backend-tz1e.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
